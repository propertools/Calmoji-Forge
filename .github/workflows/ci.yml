name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Lint and type-check against the oldest supported Python (3.9, the
    # python3 that ships with macOS), so local runs on a stock Mac resolve
    # the same tool versions as CI.
    name: lint + types (Python 3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Type check (mypy)
        run: mypy calmoji

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run test suite with coverage
        run: pytest --cov=calmoji --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  determinism:
    # Same inputs -> byte-identical output: run twice, and across the
    # oldest and newest supported Pythons. Straight from source, no install.
    name: determinism check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.13
      - name: Generate and compare
        run: |
          set -euo pipefail
          python3.13 calmoji.py --year=2030 --calendar-alignment=academic --output-dir=run-a
          python3.13 calmoji.py --year=2030 --calendar-alignment=academic --output-dir=run-b
          python3.9  calmoji.py --year=2030 --calendar-alignment=academic --output-dir=run-39
          diff -r run-a run-b
          diff -r run-a run-39
          echo "Determinism: OK"

  stock-macos:
    # The promise: works with the python3 every Mac already has.
    name: stock macOS python3
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate with system python3, no install
        run: |
          set -euo pipefail
          /usr/bin/python3 --version
          /usr/bin/python3 calmoji.py --year=2030 --calendar-alignment=academic --output-dir=run-mac
          test -n "$(ls run-mac)"
      - name: Test suite on system python3
        run: |
          /usr/bin/python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q
