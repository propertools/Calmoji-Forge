[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calmoji"
version = "0.1.0"
description = "Deterministic, UTC-fixed ritual calendar generator with EBI48 emoji time mapping."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Trey Darley", email = "trey@propertools.be" },
]
maintainers = [
    { name = "Proper Tools SRL", email = "hello@propertools.be" },
]
keywords = [
    "calendar",
    "ics",
    "icalendar",
    "rfc5545",
    "scheduling",
    "utc",
    "ebi48",
    "emoji",
    "deterministic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/propertools/Calmoji-Forge"
Repository = "https://github.com/propertools/Calmoji-Forge"
Issues = "https://github.com/propertools/Calmoji-Forge/issues"
Changelog = "https://github.com/propertools/Calmoji-Forge/blob/main/CHANGELOG.md"

[project.scripts]
calmoji = "calmoji.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["calmoji*"]
exclude = ["tests*", "output*"]

[tool.setuptools.package-data]
calmoji = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:dateutil.*",
]

[tool.coverage.run]
branch = true
source = ["calmoji"]
omit = [
    "tests/*",
    "calmoji/legacy_config.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by black/formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
